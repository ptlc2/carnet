<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="ttl desc">
  <title id="ttl">On ne peut pas coiffer une boule de poils</title>
  <desc id="desc">Deux panneaux. À gauche, une sphère couverte de poils peignés en tous sens : un épi inévitable apparaît aux deux pôles. À droite, un tore en forme de beignet, coiffé à plat sans aucun épi. En bas, trois encadrés : le vent sur Terre a toujours un point nul, l'œil d'un cyclone ; un réacteur à fusion ne peut pas être sphérique, d'où la forme en tore des tokamaks ; un carré dont on recolle les bords opposés est un tore, comme les écrans de Pac-Man.</desc>

  <rect width="1200" height="720" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">On ne peut pas coiffer une boule de poils</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Le théorème de la boule chevelue, et pourquoi un réacteur à fusion est un beignet</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Panneau gauche : la sphère ================= -->
  <text x="60" y="160" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#9c4a1e">LA SPHÈRE : UN ÉPI INÉVITABLE</text>
  <rect x="60" y="180" width="520" height="352" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- poils tangents autour de la sphère -->
  <g stroke="#6f675c" stroke-width="2.4" stroke-linecap="round">
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(0 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(20 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(40 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(60 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(80 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(100 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(120 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(140 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(160 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(180 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(200 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(220 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(240 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(260 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(280 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(300 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(320 320 360)"/>
    <line x1="430" y1="344" x2="430" y2="376" transform="rotate(340 320 360)"/>
  </g>

  <!-- sphère -->
  <circle cx="320" cy="360" r="110" fill="#e8e2d2" stroke="#b9b09e" stroke-width="2.5"/>

  <!-- épi pôle nord -->
  <path d="M320 250 c 17 0 24 15 11 23 c -11 7 -23 -1 -21 -13 c 2 -9 13 -12 19 -6" fill="none" stroke="#9c4a1e" stroke-width="3.4" stroke-linecap="round"/>
  <!-- épi pôle sud -->
  <path d="M320 470 c -17 0 -24 -15 -11 -23 c 11 -7 23 1 21 13 c -2 9 -13 12 -19 6" fill="none" stroke="#9c4a1e" stroke-width="3.4" stroke-linecap="round"/>

  <text x="400" y="242" font-family="'DejaVu Sans', sans-serif" font-size="14" font-style="italic" fill="#9c4a1e">un épi, quoi qu'on fasse</text>
  <text x="400" y="492" font-family="'DejaVu Sans', sans-serif" font-size="14" font-style="italic" fill="#9c4a1e">et un second, en face</text>
  <text x="320" y="512" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">tout champ tangent continu s'annule au moins une fois</text>

  <!-- ================= Panneau droit : le tore ================= -->
  <text x="620" y="160" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LE TORE : COIFFÉ À PLAT</text>
  <rect x="620" y="180" width="520" height="352" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- poils du tore (du bord extérieur vers le bord intérieur) -->
  <g stroke="#6f675c" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <line x1="938" y1="360" x2="1030" y2="360"/>
    <line x1="930.2" y1="376" x2="1009.9" y2="405"/>
    <line x1="909" y1="387.7" x2="955" y2="437.9"/>
    <line x1="880" y1="392" x2="880" y2="450"/>
    <line x1="851" y1="387.7" x2="805" y2="437.9"/>
    <line x1="829.8" y1="376" x2="750.1" y2="405"/>
    <line x1="822" y1="360" x2="730" y2="360"/>
    <line x1="829.8" y1="344" x2="750.1" y2="315"/>
    <line x1="851" y1="332.3" x2="805" y2="282.1"/>
    <line x1="880" y1="328" x2="880" y2="270"/>
    <line x1="909" y1="332.3" x2="955" y2="282.1"/>
    <line x1="930.2" y1="344" x2="1009.9" y2="315"/>
  </g>

  <!-- tore -->
  <ellipse cx="880" cy="360" rx="150" ry="90" fill="#e8e2d2" stroke="#b9b09e" stroke-width="2.5"/>
  <ellipse cx="880" cy="360" rx="58" ry="32" fill="#f2ede0" stroke="#b9b09e" stroke-width="2.5"/>

  <text x="880" y="492" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" font-style="italic" fill="#5c767c">aucun épi : le peigne passe partout</text>
  <text x="880" y="512" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">le trou change la topologie, donc les contraintes</text>

  <!-- ================= Bandeau bas ================= -->
  <rect x="60" y="548" width="1080" height="150" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="90" y="586" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">CE QUE LA FORME IMPOSE</text>

  <text x="120" y="622" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Météo</text>
  <text x="120" y="646" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">À chaque instant, un point de</text>
  <text x="120" y="666" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">la Terre est sans vent (l'œil du cyclone).</text>

  <text x="500" y="622" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Fusion</text>
  <text x="500" y="646" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">Une chambre sphérique perdrait son</text>
  <text x="500" y="666" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">plasma : les tokamaks sont des tores.</text>

  <text x="860" y="622" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Le tore plat</text>
  <text x="860" y="646" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">Recoller les bords d'un carré :</text>
  <text x="860" y="666" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">un monde sans bord, comme Pac-Man.</text>
</svg>
