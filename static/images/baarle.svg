<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Schéma des enclaves de Baarle</title>
  <desc id="desc">À gauche, une enclave belge dans les Pays-Bas contenant elle-même une enclave néerlandaise. À droite, une maison dont la porte est traversée par la frontière et qui porte deux numéros.</desc>

  <rect width="1200" height="800" fill="#faf7f0"/>

  <!-- ===================== Panneau gauche : enclaves imbriquées ===================== -->

  <!-- Pays-Bas (extérieur) -->
  <path d="M120,420 C100,260 200,150 360,150 C520,150 620,240 610,400 C600,560 500,650 350,650 C210,650 140,560 120,420 Z"
        fill="#f0d3b0" stroke="#9c4a1e" stroke-width="4"/>
  <text x="360" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#9c4a1e">Pays-Bas</text>

  <!-- autres enclaves, figurées par des points -->
  <g fill="#9c4a1e" opacity="0.45">
    <circle cx="250" cy="300" r="9"/>
    <circle cx="472" cy="318" r="8"/>
    <circle cx="522" cy="470" r="7"/>
    <circle cx="248" cy="540" r="8"/>
    <circle cx="436" cy="566" r="7"/>
    <circle cx="168" cy="440" r="7"/>
  </g>

  <!-- Belgique (enclave) -->
  <path d="M210,430 C200,330 270,260 360,262 C460,264 510,330 500,420 C492,520 420,560 350,558 C270,556 220,520 210,430 Z"
        fill="#f7ecd0" stroke="#9c4a1e" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="355" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#9c4a1e">Belgique</text>

  <!-- Pays-Bas (contre-enclave) -->
  <path d="M300,430 C296,380 330,352 366,354 C404,356 420,388 416,424 C412,462 384,478 352,474 C322,470 304,462 300,430 Z"
        fill="#f0d3b0" stroke="#9c4a1e" stroke-width="4"/>
  <text x="358" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#7a3a17">Pays-Bas</text>

  <!-- légende -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#6f675c">
    <rect x="120" y="700" width="26" height="18" fill="#f0d3b0" stroke="#9c4a1e" stroke-width="2"/>
    <text x="156" y="715">Pays-Bas</text>
    <rect x="290" y="700" width="26" height="18" fill="#f7ecd0" stroke="#9c4a1e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="326" y="715">Belgique</text>
  </g>

  <!-- ===================== Panneau droit : la porte-frontière ===================== -->

  <!-- drapeaux -->
  <g>
    <rect x="756" y="322" width="18" height="38" fill="#2b2b2b"/>
    <rect x="774" y="322" width="18" height="38" fill="#f2c200"/>
    <rect x="792" y="322" width="18" height="38" fill="#c8102e"/>
    <rect x="756" y="360" width="54" height="4" fill="#26221c"/>
    <rect x="1048" y="322" width="54" height="12" fill="#ae1c28"/>
    <rect x="1048" y="334" width="54" height="12" fill="#f7f7f7"/>
    <rect x="1048" y="346" width="54" height="12" fill="#21468b"/>
    <rect x="1048" y="358" width="54" height="6" fill="#26221c"/>
  </g>

  <!-- maison -->
  <path d="M790,424 L940,300 L1090,424 Z" fill="#9c4a1e"/>
  <rect x="820" y="424" width="240" height="256" fill="#f7ecd0" stroke="#9c4a1e" stroke-width="4"/>
  <circle cx="866" cy="500" r="26" fill="#e9d9b8" stroke="#9c4a1e" stroke-width="3"/>
  <line x1="866" y1="474" x2="866" y2="526" stroke="#9c4a1e" stroke-width="3"/>
  <line x1="840" y1="500" x2="892" y2="500" stroke="#9c4a1e" stroke-width="3"/>

  <!-- porte -->
  <rect x="910" y="556" width="70" height="124" fill="#e9d9b8" stroke="#26221c" stroke-width="3"/>

  <!-- frontière -->
  <line x1="945" y1="272" x2="945" y2="712" stroke="#26221c" stroke-width="5" stroke-dasharray="14 10"/>
  <line x1="945" y1="700" x2="945" y2="700" stroke="#26221c" stroke-width="5"/>

  <!-- plaques de numéro -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">
    <rect x="874" y="524" width="30" height="24" fill="#faf7f0" stroke="#26221c" stroke-width="2"/>
    <text x="889" y="542" text-anchor="middle">2</text>
    <rect x="986" y="524" width="36" height="24" fill="#faf7f0" stroke="#26221c" stroke-width="2"/>
    <text x="1004" y="542" text-anchor="middle">19</text>
  </g>

  <!-- sol -->
  <line x1="720" y1="680" x2="1160" y2="680" stroke="#ddd6c8" stroke-width="4"/>
</svg>
