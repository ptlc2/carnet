<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Le pain rassis n'a pas séché</title>
  <desc id="desc">Deux panneaux. À gauche, le devenir de l'amidon de la mie : en haut, à la cuisson, des chaînes souples dispersées dans l'eau ; en bas, au refroidissement, les mêmes chaînes alignées en cristaux qui expulsent des gouttelettes d'eau. À droite, une courbe de la vitesse du rassissement selon la température : elle culmine vers 4 degrés, au niveau d'un réfrigérateur, et tombe à zéro en dessous de moins 18 degrés, au niveau d'un congélateur.</desc>

  <rect width="1200" height="740" fill="#faf7f0"/>

  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Le pain rassis n'a pas séché</text>
  <text x="600" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">L'amidon de la mie se recristallise et chasse l'eau</text>

  <line x1="60" y1="128" x2="1140" y2="128" stroke="#ddd6c8" stroke-width="2"/>

  <text x="315" y="172" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="15" fill="#5c767c">DANS LA MIE</text>
  <text x="880" y="172" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="15" fill="#5c767c">LA VITESSE SELON LA TEMPÉRATURE</text>

  <text x="90" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#26221c">À la cuisson</text>
  <text x="90" y="248" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">les granules gonflent, les chaînes se dispersent dans l'eau</text>
  <rect x="90" y="264" width="450" height="112" rx="10" fill="#f3ecdd" stroke="#ddd6c8" stroke-width="1.5"/>
  <g stroke="#9c4a1e" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M120 300 q22 -16 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0"/>
    <path d="M120 332 q20 14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M140 358 q18 -12 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0"/>
  </g>
  <g fill="#8fb4c4">
    <circle cx="150" cy="286" r="4"/>
    <circle cx="300" cy="298" r="4"/>
    <circle cx="430" cy="284" r="4"/>
    <circle cx="235" cy="362" r="4"/>
    <circle cx="480" cy="356" r="4"/>
  </g>

  <line x1="315" y1="392" x2="315" y2="428" stroke="#9c4a1e" stroke-width="3"/>
  <polygon points="315,438 308,424 322,424" fill="#9c4a1e"/>
  <text x="330" y="418" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">en refroidissant</text>

  <text x="90" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#26221c">Au refroidissement</text>
  <text x="90" y="498" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">les chaînes s'alignent en cristaux et chassent l'eau</text>
  <rect x="90" y="514" width="450" height="118" rx="10" fill="#f3ecdd" stroke="#ddd6c8" stroke-width="1.5"/>
  <g stroke="#9c4a1e" stroke-width="2.8" stroke-linecap="round">
    <line x1="128" y1="582" x2="196" y2="540"/>
    <line x1="170" y1="592" x2="238" y2="550"/>
    <line x1="212" y1="602" x2="280" y2="560"/>
    <line x1="254" y1="612" x2="322" y2="570"/>
    <line x1="296" y1="622" x2="364" y2="580"/>
  </g>
  <g fill="#8fb4c4">
    <circle cx="400" cy="556" r="5"/>
    <circle cx="430" cy="582" r="5"/>
    <circle cx="458" cy="608" r="5"/>
    <circle cx="404" cy="604" r="5"/>
    <circle cx="432" cy="626" r="5"/>
  </g>

  <circle cx="100" cy="661" r="4.5" fill="#8fb4c4"/>
  <text x="114" y="666" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">eau expulsée par les cristaux</text>

  <text x="648" y="452" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c" transform="rotate(-90 648 452)">vitesse du rassissement</text>

  <line x1="660" y1="290" x2="660" y2="600" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="660" y1="600" x2="1120" y2="600" stroke="#c9c2b4" stroke-width="2"/>

  <rect x="700" y="290" width="44" height="310" fill="#eaf1f4"/>

  <path d="M700 585 C 770 578, 840 392, 897 330 C 952 372, 1000 458, 1028 470 C 1062 484, 1090 496, 1110 506" fill="none" stroke="#9c4a1e" stroke-width="3"/>

  <line x1="716" y1="326" x2="716" y2="600" stroke="#5c767c" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="726" y="356" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">congélateur</text>
  <text x="726" y="374" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">le rassissement s'arrête</text>

  <circle cx="897" cy="330" r="6" fill="#9c4a1e"/>
  <text x="908" y="322" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#26221c">réfrigérateur, vers 4 °C</text>
  <text x="908" y="341" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">rassissement maximal</text>

  <g stroke="#c9c2b4" stroke-width="1.5">
    <line x1="700" y1="600" x2="700" y2="606"/>
    <line x1="864" y1="600" x2="864" y2="606"/>
    <line x1="946" y1="600" x2="946" y2="606"/>
    <line x1="1028" y1="600" x2="1028" y2="606"/>
    <line x1="1110" y1="600" x2="1110" y2="606"/>
  </g>
  <g font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c" text-anchor="middle">
    <text x="700" y="628">−20</text>
    <text x="864" y="628">0</text>
    <text x="946" y="628">10</text>
    <text x="1028" y="628">20</text>
    <text x="1110" y="628">30 °C</text>
  </g>
  <text x="1028" y="646" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#9a9287">ambiante</text>

  <text x="890" y="682" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" font-style="italic" fill="#6f675c">réchauffer vers 60 °C défait les cristaux</text>
</svg>
