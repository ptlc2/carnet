<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="ttl desc">
  <title id="ttl">La pièce la plus forte des échecs était la plus faible</title>
  <desc id="desc">À gauche, un échiquier ancien où le ferz, conseiller des origines, n'atteint que les quatre cases en diagonale autour de lui. À droite, le même échiquier avec la dame moderne, qui balaie toute sa rangée, sa colonne et ses deux diagonales. En bas, une frise de cinq repères : vers l'an mil le nom regina, vers 1300 le saut de deux cases, 1475 le poème valencien, 1492 l'expulsion des juifs d'Espagne, 1497 le livre de Lucena.</desc>

  <rect width="1200" height="880" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#26221c">La pièce la plus forte des échecs était la plus faible</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Comment un conseiller timide est devenu la pièce la plus redoutée</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

