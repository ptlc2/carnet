<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl">
  <title id="ttl">Illustration : une enfant sourit devant une maison en feu</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0d15"/>
      <stop offset="0.46" stop-color="#271623"/>
      <stop offset="0.74" stop-color="#682c1f"/>
      <stop offset="1" stop-color="#b84c1c"/>
    </linearGradient>
    <radialGradient id="fireglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#ff8a2b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="0.38" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e2381c"/>
    </linearGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efbb95"/>
      <stop offset="1" stop-color="#d99e74"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="flameShape" d="M0,0 C-40,-30 -30,-84 0,-132 C30,-84 40,-30 0,0 Z"/>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="420" cy="560" rx="520" ry="370" fill="url(#fireglow)"/>

  <!-- distant pines, low and soft -->
  <g fill="#140d14" opacity="0.85">
    <path d="M60,668 L110,520 L160,668 Z"/>
    <path d="M140,668 L196,560 L252,668 Z"/>
    <path d="M1030,668 L1084,548 L1138,668 Z"/>
    <path d="M1120,668 L1168,586 L1216,668 Z"/>
  </g>

  <!-- smoke -->
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="380" cy="230" rx="220" ry="130" fill="#3a2f38"/>
    <ellipse cx="540" cy="150" rx="170" ry="100" fill="#473b45"/>
    <ellipse cx="280" cy="136" rx="136" ry="86" fill="#312831"/>
  </g>

  <!-- fire behind the house -->
  <g filter="url(#soft2)" opacity="0.85">
    <ellipse cx="400" cy="330" rx="230" ry="128" fill="#ff7a1e" opacity="0.75"/>
    <ellipse cx="560" cy="400" rx="150" ry="86" fill="#ff8a2b" opacity="0.6"/>
  </g>
  <g fill="url(#flame)">
    <use href="#flameShape" transform="translate(246,470) scale(0.9)"/>
    <use href="#flameShape" transform="translate(318,430) scale(1.5)"/>
    <use href="#flameShape" transform="translate(392,410) scale(1.9)"/>
    <use href="#flameShape" transform="translate(472,432) scale(1.6)"/>
    <use href="#flameShape" transform="translate(550,458) scale(1.15)"/>
    <use href="#flameShape" transform="translate(610,486) scale(0.85)"/>
  </g>

  <!-- house (roof in front of the flames) -->
  <g>
    <path d="M210,668 L210,430 L420,296 L630,430 L630,668 Z" fill="#1c1319"/>
    <path d="M176,440 L420,272 L664,440 L640,474 L420,316 L200,474 Z" fill="#120c12"/>
    <!-- chimney -->
    <rect x="520" y="322" width="46" height="86" fill="#160f14"/>
    <!-- glowing windows -->
    <rect x="262" y="486" width="98" height="104" rx="4" fill="#ffb347"/>
    <rect x="482" y="486" width="98" height="104" rx="4" fill="#ff9a2e"/>
    <rect x="376" y="520" width="60" height="90" rx="4" fill="#ffd97a"/>
    <rect x="546" y="626" width="66" height="42" rx="3" fill="#ff8a2b" opacity="0.85"/>
    <!-- flames licking the windows -->
    <g fill="url(#flame)" opacity="0.95">
      <use href="#flameShape" transform="translate(311,578) scale(0.5)"/>
      <use href="#flameShape" transform="translate(531,578) scale(0.5)"/>
      <use href="#flameShape" transform="translate(406,606) scale(0.42)"/>
    </g>
    <!-- embers -->
    <g fill="#ffcf7a">
      <circle cx="360" cy="270" r="4" opacity="0.8"/>
      <circle cx="470" cy="216" r="3" opacity="0.7"/>
      <circle cx="292" cy="300" r="3" opacity="0.6"/>
      <circle cx="556" cy="266" r="4" opacity="0.7"/>
      <circle cx="418" cy="170" r="3" opacity="0.5"/>
    </g>
  </g>

  <!-- ground -->
  <path d="M0,668 L1200,668 L1200,800 L0,800 Z" fill="#0c090d"/>
  <ellipse cx="420" cy="700" rx="580" ry="92" fill="#c2531d" opacity="0.16" filter="url(#soft)"/>

  <!-- girl, foreground -->
  <g>
    <!-- torso -->
    <path d="M616,800 C624,714 664,662 704,648 L862,648 C902,662 942,714 950,800 Z" fill="#e9e2d1"/>
    <path d="M616,800 C624,714 664,662 704,648 L748,648 C716,674 684,722 674,800 Z" fill="#f3ecdf"/>
    <!-- neck -->
    <path d="M748,556 L818,556 L818,604 C818,618 748,618 748,604 Z" fill="#d1966e"/>
    <path d="M748,556 L778,556 L778,608 C760,612 750,610 748,604 Z" fill="#c2885f"/>
    <!-- ears -->
    <ellipse cx="666" cy="474" rx="17" ry="25" fill="#dc9f75"/>
    <ellipse cx="900" cy="474" rx="17" ry="25" fill="#d1966e"/>
    <!-- head: round, childlike -->
    <path d="M664,458 C664,394 708,354 782,354 C856,354 900,394 900,458 C900,514 856,558 782,570 C708,558 664,514 664,458 Z" fill="url(#faceShade)"/>
    <!-- rim light, left contour -->
    <path d="M670,436 C660,492 678,544 720,566 C690,538 678,492 682,440 Z" fill="#ffcf9a" opacity="0.6"/>
    <!-- hair: bangs + sides -->
    <path d="M662,474 C650,360 696,320 782,320 C868,320 914,360 902,474 C896,420 872,392 850,386 C820,428 744,428 714,386 C694,394 670,418 662,474 Z" fill="#2b1d17"/>
    <path d="M662,458 C656,512 664,552 690,564 C678,524 676,482 680,448 Z" fill="#241811"/>
    <path d="M902,458 C908,512 900,552 874,564 C886,524 888,482 884,448 Z" fill="#1f1410"/>
    <!-- brows: left raised -->
    <path d="M700,430 Q730,414 758,428" stroke="#241811" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M808,440 Q834,434 858,446" stroke="#241811" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- big eyes, glancing toward the fire (left) -->
    <path d="M698,478 Q726,454 754,476 Q726,498 698,478 Z" fill="#f7f1e6"/>
    <path d="M812,478 Q840,454 868,476 Q840,498 812,478 Z" fill="#f7f1e6"/>
    <circle cx="720" cy="476" r="12" fill="#3a2a20"/>
    <circle cx="834" cy="476" r="12" fill="#3a2a20"/>
    <circle cx="715" cy="472" r="4" fill="#fbf6ec"/>
    <circle cx="829" cy="472" r="4" fill="#fbf6ec"/>
    <path d="M696,472 Q726,458 754,472" stroke="#2b1d17" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M810,472 Q840,458 868,472" stroke="#2b1d17" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- small nose -->
    <path d="M780,494 Q789,510 778,520" stroke="#c07f57" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- smirk -->
    <path d="M722,534 C752,556 796,556 830,526" stroke="#7c3427" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M816,540 C834,538 848,528 854,516 C846,536 832,544 816,546 Z" fill="#7c3427"/>
    <!-- blush -->
    <ellipse cx="706" cy="506" rx="22" ry="12" fill="#e07a5a" opacity="0.34"/>
    <ellipse cx="858" cy="506" rx="22" ry="12" fill="#e07a5a" opacity="0.34"/>
  </g>
</svg>
