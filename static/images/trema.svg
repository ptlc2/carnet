<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Le tréma n'ajoute rien, il sépare</title>
  <desc id="desc">Deux panneaux opposés. À gauche, en français, le tréma sépare : « mais » se dit [mɛ] mais « maïs » se dit [ma.is] ; dans « aiguë » il fait entendre le u, dans « de Staël » il marque un e muet. À droite, en allemand, le même signe transforme : il change la voyelle u en ü, a en ä, o en ö, une voyelle nouvelle et non deux sons.</desc>

  <rect width="1200" height="760" fill="#faf7f0"/>

  <text x="600" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Le tréma n'ajoute rien, il sépare</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Deux points, deux métiers opposés</text>

  <circle cx="586" cy="140" r="8" fill="#26221c"/>
  <circle cx="614" cy="140" r="8" fill="#26221c"/>
  <text x="660" y="147" font-family="'DejaVu Sans', sans-serif" font-size="16" fill="#6f675c">trêma, du grec : « trou », « points sur un dé »</text>

  <line x1="60" y1="176" x2="1140" y2="176" stroke="#ddd6c8" stroke-width="2"/>

  <line x1="600" y1="200" x2="600" y2="700" stroke="#ddd6c8" stroke-width="2"/>

  <text x="330" y="236" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#5c767c">EN FRANÇAIS</text>
  <text x="330" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#9c4a1e">le tréma sépare</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#26221c">
    <text x="120" y="360">mais</text>
    <text x="330" y="360">maïs</text>
  </g>
  <g font-family="'DejaVu Sans', sans-serif" font-size="17" fill="#6f675c">
    <text x="120" y="388">[mɛ], une voyelle</text>
    <text x="330" y="388">[ma.is], deux voyelles</text>
  </g>
  <path d="M262 352 L292 352" stroke="#9c4a1e" stroke-width="2.5"/>
  <path d="M292 352 l-10 -6 l0 12 z" fill="#9c4a1e"/>

  <line x1="90" y1="424" x2="570" y2="424" stroke="#ece5d7" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#26221c">
    <text x="120" y="480">aiguë</text>
    <text x="120" y="548">de Staël</text>
  </g>
  <g font-family="'DejaVu Sans', sans-serif" font-size="16" fill="#6f675c">
    <text x="300" y="480">les points font entendre le « u »</text>
    <text x="300" y="548">les points marquent un « e » muet</text>
  </g>

  <text x="330" y="650" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#6f675c">« Prononcez les deux. »</text>

  <text x="870" y="236" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#5c767c">EN ALLEMAND</text>
  <text x="870" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#9c4a1e">l'umlaut transforme</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#26221c" text-anchor="middle">
    <text x="740" y="372">u → ü</text>
    <text x="1000" y="372">a → ä</text>
    <text x="740" y="440">o → ö</text>
    <text x="1000" y="440">e → ë</text>
  </g>
  <g font-family="'DejaVu Sans', sans-serif" font-size="16" fill="#6f675c">
    <text x="870" y="504" text-anchor="middle">ü, ä, ö : des voyelles nouvelles, pas des paires</text>
    <text x="870" y="536" text-anchor="middle">über, Mädchen</text>
    <text x="870" y="580" text-anchor="middle">faute de signe, on écrit ue, ae, oe : Muesli</text>
  </g>

  <text x="870" y="650" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#6f675c">« Ce n'est plus la même voyelle. »</text>

  <line x1="60" y1="700" x2="1140" y2="700" stroke="#ddd6c8" stroke-width="2"/>
  <text x="600" y="736" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="17" fill="#5c767c">Un seul signe : d'un côté il sépare deux sons, de l'autre il en change un.</text>
</svg>
