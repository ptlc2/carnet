  <text x="1096" y="220" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#9c4a1e">le taon fonce…</text>
  <text x="880" y="446" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#9c4a1e">…percute et repart</text>
  <text x="660" y="472" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">les rayures brouillent l'atterrissage</text>

