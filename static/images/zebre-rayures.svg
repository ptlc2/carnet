  <text x="60" y="540" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LES CINQ HYPOTHÈSES</text>

  <g font-family="'DejaVu Sans', sans-serif" font-size="17" fill="#26221c">
    <g transform="translate(64,568)">
      <circle cx="10" cy="-6" r="11" fill="none" stroke="#b9b09e" stroke-width="2"/>
      <path d="M 3 -6 L 17 -6 M 10 -13 L 10 1" stroke="#b0472e" stroke-width="2.6" stroke-linecap="round"/>
