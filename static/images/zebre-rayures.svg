    </g>
    <g transform="translate(64,600)">
      <circle cx="10" cy="-6" r="11" fill="none" stroke="#b9b09e" stroke-width="2"/>
      <path d="M 3 -6 L 17 -6 M 10 -13 L 10 1" stroke="#b0472e" stroke-width="2.6" stroke-linecap="round"/>
      <text x="34" y="0" fill="#8a8275">confusion des prédateurs</text>
    </g>
    <g transform="translate(64,632)">
      <circle cx="10" cy="-6" r="11" fill="none" stroke="#b9b09e" stroke-width="2"/>
