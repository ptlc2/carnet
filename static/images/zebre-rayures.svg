<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Le zèbre n'est pas rayé pour se cacher</title>
  <desc id="desc">En haut, la tête et l'encolure d'un zèbre rayé de noir et blanc, entouré de taons qui approchent selon des trajectoires en pointillé ; l'un percute la robe et rebondit sans se poser. En bas, la liste des cinq hypothèses : camouflage, confusion des prédateurs, régulation thermique et fonction sociale sont barrées d'une croix, seule celle des mouches piqueuses est cochée. À droite, un graphique en barres montre environ deux fois moins de mouches posées sur une robe rayée que sur une robe unie.</desc>

  <rect width="1200" height="720" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Le zèbre n'est pas rayé pour se cacher</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">La piste des mouches piqueuses, des caméras aux vaches peintes</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <text x="60" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LE ZÈBRE ET LES MOUCHES</text>

