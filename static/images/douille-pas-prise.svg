<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ttl desc">
  <title id="ttl">La douille n'est pas une prise</title>
  <desc id="desc">À gauche, une douille de lampe avec une ampoule de 60 watts : la douille est gravée 60 W max et laisse passer environ 0,26 ampère. À droite, la même douille équipée d'un adaptateur prise alimentant un appareil de 2 000 watts : le courant est d'environ 8,7 ampères, une trentaine de fois plus, alors que la douille porte toujours la même limite de 60 W.</desc>

  <rect width="1200" height="700" fill="#faf7f0"/>

  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">La douille n'est pas une prise</text>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#6f675c">Le même objet, deux courants.</text>

  <line x1="60" y1="140" x2="1140" y2="140" stroke="#ddd6c8" stroke-width="2"/>
  <line x1="600" y1="170" x2="600" y2="640" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Panneau gauche : une ampoule ================= -->
  <text x="320" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#26221c">Une ampoule</text>
  <text x="320" y="224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#6f675c">l'usage prévu</text>

  <circle cx="320" cy="320" r="54" fill="#e8d9c6" stroke="#26221c" stroke-width="2.5"/>
  <path d="M292 358 h56 v34 h-56 z" fill="#c9bfa8" stroke="#26221c" stroke-width="2.5"/>
  <g stroke="#26221c" stroke-width="1.4" opacity="0.5">
    <line x1="292" y1="368" x2="348" y2="368"/>
    <line x1="292" y1="378" x2="348" y2="378"/>
    <line x1="292" y1="388" x2="348" y2="388"/>
  </g>
  <rect x="278" y="392" width="84" height="70" rx="8" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <text x="320" y="434" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="16" fill="#9c4a1e">60 W max</text>

  <text x="320" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#26221c">&#8776; 0,26 A</text>
  <text x="320" y="576" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">quelques dixièmes d'ampère</text>
  <text x="320" y="606" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#6f675c">la douille chauffe un peu, rien de plus</text>

  <!-- ================= Panneau droit : un appareil ================= -->
  <text x="880" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#26221c">Un appareil</text>
  <text x="880" y="224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#6f675c">via un adaptateur prise</text>

  <rect x="792" y="262" width="176" height="80" rx="8" fill="#9c4a1e"/>
  <text x="880" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#faf7f0">2 000 W</text>
  <text x="880" y="326" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#f0e3d4">forte puissance</text>

  <line x1="880" y1="342" x2="880" y2="418" stroke="#26221c" stroke-width="4"/>
  <path d="M866 418 h28 v22 h-28 z" fill="#c9bfa8" stroke="#26221c" stroke-width="2.5"/>
  <rect x="852" y="440" width="56" height="34" rx="4" fill="#e8d9c6" stroke="#26221c" stroke-width="2.5"/>
  <text x="880" y="500" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">adaptateur</text>
  <rect x="838" y="508" width="84" height="66" rx="8" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <text x="880" y="548" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="16" fill="#9c4a1e">60 W max</text>

  <text x="880" y="618" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#9c4a1e">&#8776; 8,7 A</text>
  <text x="880" y="646" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#6f675c">une trentaine de fois plus</text>
</svg>
