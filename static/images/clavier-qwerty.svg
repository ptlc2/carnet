<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Pourquoi le clavier commence par QWERTY</title>
  <desc id="desc">En haut, deux rangées de touches comparées : la première, en 1868, suit l'ordre alphabétique de A à M, comme un clavier de piano. La seconde, en 1874, est déjà le QWERTY moderne, de Q à P, avec les lettres E et R mises en évidence. Au milieu, deux encadrés exposent la légende (un clavier dessiné pour ralentir la frappe, jamais attestée) et l'hypothèse retenue (un ordre hérité du retour d'expérience des opérateurs du télégraphe Morse). En bas, une frise rappelle cinq dates : 1868, 1874, 1878, 1893 et 1932.</desc>

  <rect width="1200" height="880" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Pourquoi le clavier commence par QWERTY</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Un ordre inventé pour des machines qui n'existent plus</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Ordre alphabétique ================= -->
  <text x="148" y="212" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">1868 : L'ORDRE ALPHABÉTIQUE, COMME UN PIANO</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#26221c" text-anchor="middle">
    <rect x="148" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="180" y="291">A</text>
    <rect x="218" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="250" y="291">B</text>
    <rect x="288" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="320" y="291">C</text>
    <rect x="358" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="390" y="291">D</text>
    <rect x="428" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="460" y="291">E</text>
    <rect x="498" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="530" y="291">F</text>
    <rect x="568" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="600" y="291">G</text>
    <rect x="638" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="670" y="291">H</text>
    <rect x="708" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="740" y="291">I</text>
    <rect x="778" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="810" y="291">J</text>
    <rect x="848" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="880" y="291">K</text>
    <rect x="918" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="950" y="291">L</text>
    <rect x="988" y="250" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="1020" y="291">M</text>
  </g>

  <!-- ================= Ordre QWERTY ================= -->
  <text x="253" y="382" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">1874 : L'ORDRE QWERTY, DÉJÀ LE NÔTRE</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#26221c" text-anchor="middle">
    <rect x="253" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="285" y="461">Q</text>
    <rect x="323" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="355" y="461">W</text>
    <rect x="393" y="420" width="64" height="64" rx="8" fill="#9c4a1e"/><text x="425" y="461" fill="#faf7f0">E</text>
    <rect x="463" y="420" width="64" height="64" rx="8" fill="#9c4a1e"/><text x="495" y="461" fill="#faf7f0">R</text>
    <rect x="533" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="565" y="461">T</text>
    <rect x="603" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="635" y="461">Y</text>
    <rect x="673" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="705" y="461">U</text>
    <rect x="743" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="775" y="461">I</text>
    <rect x="813" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="845" y="461">O</text>
    <rect x="883" y="420" width="64" height="64" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/><text x="915" y="461">P</text>
  </g>

  <text x="463" y="520" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#9c4a1e">« er », quatrième paire de lettres la plus fréquente en anglais, ici côte à côte</text>

  <!-- ================= Légende et hypothèse ================= -->
  <line x1="60" y1="562" x2="1140" y2="562" stroke="#ddd6c8" stroke-width="2"/>

  <rect x="60" y="586" width="510" height="150" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="84" y="622" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LA LÉGENDE</text>
  <text x="84" y="654" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">« Dessiné pour ralentir la frappe »</text>
  <text x="84" y="682" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">On raconte qu'on aurait éloigné les lettres fréquentes</text>
  <text x="84" y="700" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">pour éviter que les tiges se coincent, quitte à freiner</text>
  <text x="84" y="718" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">le dactylographe. Aucune source d'époque ne l'atteste.</text>

  <rect x="630" y="586" width="510" height="150" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="654" y="622" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">L'HYPOTHÈSE RETENUE</text>
  <text x="654" y="654" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">Un héritage du télégraphe</text>
  <text x="654" y="682" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">Yasuoka (2011) : l'ordre vient du retour des opérateurs</text>
  <text x="654" y="700" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">Morse, pas de la mécanique. Séparer les paires</text>
  <text x="654" y="718" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">fréquentes fait alterner les mains : cela accélère.</text>

  <!-- ================= Frise ================= -->
  <line x1="150" y1="790" x2="1050" y2="790" stroke="#26221c" stroke-width="3"/>

  <g font-family="'DejaVu Sans', sans-serif" text-anchor="middle">
    <circle cx="150" cy="790" r="8" fill="#9c4a1e"/>
    <text x="150" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1868</text>
    <text x="150" y="820" font-size="13" fill="#6f675c">brevet de</text>
    <text x="150" y="838" font-size="13" fill="#6f675c">Sholes</text>

    <circle cx="375" cy="790" r="8" fill="#26221c"/>
    <text x="375" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1874</text>
    <text x="375" y="820" font-size="13" fill="#6f675c">Remington</text>
    <text x="375" y="838" font-size="13" fill="#6f675c">met en vente</text>

    <circle cx="600" cy="790" r="8" fill="#26221c"/>
    <text x="600" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1878</text>
    <text x="600" y="820" font-size="13" fill="#6f675c">Remington n°2,</text>
    <text x="600" y="838" font-size="13" fill="#6f675c">majuscules</text>

    <circle cx="825" cy="790" r="8" fill="#26221c"/>
    <text x="825" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1893</text>
    <text x="825" y="820" font-size="13" fill="#6f675c">devient la norme</text>
    <text x="825" y="838" font-size="13" fill="#6f675c">de fait</text>

    <circle cx="1050" cy="790" r="8" fill="#9c4a1e"/>
    <text x="1050" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1932</text>
    <text x="1050" y="820" font-size="13" fill="#6f675c">le Dvorak</text>
    <text x="1050" y="838" font-size="13" fill="#6f675c">échoue à percer</text>
  </g>
</svg>
