<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Reconnaître un arbre par ses bourgeons en hiver</title>
  <desc id="desc">À gauche, deux rameaux d'hiver : l'un à bourgeons opposés (frêne, érable, marronnier), l'autre à bourgeons alternes (chêne, hêtre, bouleau). À droite, quatre portraits de bourgeons : frêne, hêtre, marronnier (avec sa cicatrice foliaire en fer à cheval) et chêne.</desc>

  <rect width="1200" height="800" fill="#faf7f0"/>

  <!-- ===================== En-tête ===================== -->
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#3f3a30">Reconnaître un arbre par ses bourgeons</text>
  <text x="600" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#6f675c">En hiver, sans une seule feuille, c'est le rameau qui parle.</text>
  <line x1="600" y1="140" x2="600" y2="704" stroke="#ddd6c8" stroke-width="3"/>

  <!-- ===================== Panneau gauche : la première question ===================== -->
  <text x="310" y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3f3a30">La première question : opposés ou alternes ?</text>

  <!-- Rameau A : bourgeons opposés -->
  <rect x="183" y="240" width="14" height="384" rx="7" fill="#7a5f3a"/>
  <g fill="#6b5230" stroke="#4a3a22" stroke-width="2">
    <!-- noeuds opposés, par paires -->
    <g transform="translate(184,282) rotate(-50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(196,282) rotate(50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(184,352) rotate(-50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(196,352) rotate(50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(184,422) rotate(-50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(196,422) rotate(50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(184,492) rotate(-50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(196,492) rotate(50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(184,562) rotate(-50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(196,562) rotate(50)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
  </g>
  <text x="190" y="662" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3f3a30">Opposés</text>
  <text x="190" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6f675c">frêne, érable, marronnier</text>

  <!-- Rameau B : bourgeons alternes -->
  <rect x="413" y="240" width="14" height="384" rx="7" fill="#7a5f3a"/>
  <g fill="#6b5230" stroke="#4a3a22" stroke-width="2">
    <g transform="translate(426,290) rotate(55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(414,352) rotate(-55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(426,414) rotate(55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(414,476) rotate(-55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(426,538) rotate(55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
    <g transform="translate(414,596) rotate(-55)"><path d="M0,0 C-13,-9 -15,-30 0,-42 C15,-30 13,-9 0,0 Z"/></g>
  </g>
  <text x="420" y="662" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3f3a30">Alternes</text>
  <text x="420" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6f675c">chêne, hêtre, bouleau</text>

  <!-- ===================== Panneau droit : quatre signatures ===================== -->
  <text x="880" y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3f3a30">Quatre signatures</text>

  <!-- Frêne -->
  <rect x="754" y="250" width="12" height="150" rx="6" fill="#7a5f3a"/>
  <path d="M760,206 L742,254 L778,254 Z" fill="#26221c"/>
  <ellipse cx="747" cy="300" rx="7" ry="13" fill="#26221c" transform="rotate(-18 747 300)"/>
  <ellipse cx="773" cy="300" rx="7" ry="13" fill="#26221c" transform="rotate(18 773 300)"/>
  <text x="760" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3f3a30">Frêne</text>
  <text x="760" y="454" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">bourgeons noirs, veloutés</text>

  <!-- Hêtre -->
  <rect x="994" y="250" width="12" height="150" rx="6" fill="#7a5f3a"/>
  <ellipse cx="1010" cy="252" rx="8" ry="34" fill="#8a6a3f" stroke="#5e4826" stroke-width="2" transform="rotate(26 1010 252)"/>
  <ellipse cx="1002" cy="330" rx="6" ry="22" fill="#8a6a3f" stroke="#5e4826" stroke-width="2" transform="rotate(26 1002 330)"/>
  <text x="1000" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3f3a30">Hêtre</text>
  <text x="1000" y="454" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">bourgeons fuselés, écartés</text>

  <!-- Marronnier -->
  <rect x="752" y="516" width="16" height="144" rx="8" fill="#7a5f3a"/>
  <ellipse cx="768" cy="502" rx="22" ry="34" fill="#6f5230" stroke="#4a3a22" stroke-width="2" transform="rotate(8 768 502)"/>
  <ellipse cx="760" cy="490" rx="6" ry="12" fill="#a8895c" transform="rotate(8 760 490)"/>
  <path d="M744,560 A17,17 0 1 0 776,560" fill="none" stroke="#4a3a22" stroke-width="3"/>
  <g fill="#4a3a22">
    <circle cx="752" cy="564" r="2.4"/>
    <circle cx="760" cy="567" r="2.4"/>
    <circle cx="768" cy="564" r="2.4"/>
    <circle cx="756" cy="556" r="2.4"/>
    <circle cx="764" cy="556" r="2.4"/>
  </g>
  <text x="760" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3f3a30">Marronnier</text>
  <text x="760" y="714" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">gros bourgeon visqueux,</text>
  <text x="760" y="736" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">cicatrice en fer à cheval</text>

  <!-- Chêne -->
  <rect x="992" y="516" width="16" height="144" rx="8" fill="#7a5f3a"/>
  <line x1="996" y1="516" x2="996" y2="660" stroke="#5e4826" stroke-width="2"/>
  <line x1="1004" y1="516" x2="1004" y2="660" stroke="#5e4826" stroke-width="2"/>
  <ellipse cx="1000" cy="500" rx="9" ry="20" fill="#7a5a2e" stroke="#4a3a22" stroke-width="2"/>
  <ellipse cx="1014" cy="508" rx="8" ry="17" fill="#7a5a2e" stroke="#4a3a22" stroke-width="2" transform="rotate(24 1014 508)"/>
  <ellipse cx="986" cy="510" rx="8" ry="16" fill="#7a5a2e" stroke="#4a3a22" stroke-width="2" transform="rotate(-24 986 510)"/>
  <text x="1000" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3f3a30">Chêne</text>
  <text x="1000" y="714" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">bourgeons groupés</text>
  <text x="1000" y="736" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6f675c">au bout du rameau</text>
</svg>
