<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ttl desc">
  <title id="ttl">La ligne où l'on change de jour</title>
  <desc id="desc">Schéma de la ligne de changement de date dans le Pacifique. Une ligne verticale claire en pointillé marque le méridien de 180 degrés. Par-dessus, une ligne épaisse en zigzag figure la ligne réelle : elle s'incurve vers l'ouest au détroit de Béring, enlace les Fidji et les Tonga, puis se creuse vers l'est autour des Kiribati avant de repasser entre les Samoa et les Samoa américaines. Un encadré, en bas à gauche, montre les deux îles Diomède, séparées de 3,8 kilomètres mais distantes de vingt-et-une heures.</desc>

  <rect width="1200" height="700" fill="#faf7f0"/>

  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">La ligne où l'on change de jour</text>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#6f675c">Elle n'existe pas sur le terrain : elle zigzague pour ne couper aucun pays en deux</text>

  <line x1="60" y1="140" x2="1140" y2="140" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Océan ================= -->
  <rect x="40" y="160" width="1120" height="480" rx="16" fill="#cfdde0" stroke="#26221c" stroke-width="2"/>

  <!-- Méridien de 180° -->
  <line x1="600" y1="160" x2="600" y2="640" stroke="#7f9aa0" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="600" y="626" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">méridien de 180°</text>

  <!-- ================= Ligne de changement de date (zigzag) ================= -->
  <path d="M 615 160
           L 600 200
           L 545 250
           L 600 305
           L 625 360
           L 600 405
           L 600 440
           L 745 472
           L 785 500
           L 630 524
           L 585 556
           L 610 592
           L 600 640"
        fill="none" stroke="#9c4a1e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ================= Repères ================= -->
  <!-- Béring / Diomède -->
  <circle cx="560" cy="225" r="6" fill="#26221c"/>
  <line x1="560" y1="225" x2="392" y2="212" stroke="#26221c" stroke-width="1.4"/>
  <text x="388" y="205" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">détroit de Béring</text>
  <text x="388" y="225" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">îles Diomède (21 h d'écart)</text>

  <!-- Russie / Alaska -->
  <text x="120" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#6f675c" font-style="italic">Russie</text>
  <text x="1080" y="300" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#6f675c" font-style="italic">Alaska</text>

  <!-- Kiribati -->
  <circle cx="770" cy="498" r="6" fill="#26221c"/>
  <line x1="770" y1="498" x2="1000" y2="490" stroke="#26221c" stroke-width="1.4"/>
  <text x="1006" y="494" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">Kiribati · UTC+14</text>

  <!-- Samoa -->
  <circle cx="600" cy="540" r="6" fill="#26221c"/>
  <line x1="600" y1="540" x2="722" y2="572" stroke="#26221c" stroke-width="1.4"/>
  <text x="728" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">Samoa / Samoa américaines</text>
  <text x="728" y="588" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">un jour sépare ces voisines</text>

  <!-- Fidji / Tonga -->
  <text x="1060" y="380" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">Fidji · Tonga</text>

  <!-- Ouest / Est -->
  <text x="150" y="620" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#5c767c">à l'ouest : demain</text>
  <text x="1050" y="620" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#5c767c">à l'est : hier</text>

  <!-- ================= Encadré Diomède ================= -->
  <rect x="70" y="330" width="360" height="196" rx="12" fill="#faf7f0" stroke="#26221c" stroke-width="2"/>
  <text x="250" y="362" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26221c">Détroit de Béring</text>
  <text x="250" y="384" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">3,8 km — mais 21 h d'écart</text>

  <!-- deux îles -->
  <g fill="#c9bfa8" stroke="#26221c" stroke-width="2.5">
    <ellipse cx="150" cy="452" rx="40" ry="24"/>
    <ellipse cx="350" cy="452" rx="40" ry="24"/>
  </g>
  <text x="150" y="420" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#26221c">grande Diomède</text>
  <text x="150" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#9c4a1e">Russie · demain</text>
  <text x="350" y="420" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#26221c">petite Diomède</text>
  <text x="350" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#9c4a1e">États-Unis · hier</text>

  <!-- trait de la ligne entre les deux -->
  <path d="M 250 400 L 250 452 L 250 504" fill="none" stroke="#9c4a1e" stroke-width="3.5" stroke-dasharray="7 6"/>
  <text x="250" y="470" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="11.5" fill="#9c4a1e">la ligne</text>
</svg>
