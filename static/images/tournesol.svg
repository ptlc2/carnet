<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Le tournesol suit le soleil, puis il s'arrête</title>
  <desc id="desc">Trois panneaux. À gauche, un jeune tournesol dont la tête décrit un arc de l'est vers l'ouest pendant la journée, puis revient vers l'est pendant la nuit. Au centre, la tige : le jour le côté est s'allonge et la tige penche vers l'ouest, la nuit le côté ouest s'allonge et la tête revient vers l'est. À droite, un tournesol fleuri, tête fixe tournée vers l'est, qui attire cinq fois plus de pollinisateurs. En bas, un encadré sur l'horloge interne : en lumière fixe la plante oscille encore quelques jours, un cycle de vingt-quatre heures est suivi, un cycle de trente heures ne l'est pas.</desc>

  <rect width="1200" height="760" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Le tournesol suit le soleil, puis il s'arrête</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Un mouvement de jeunesse, réglé par une horloge interne</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Panneau 1 : le jour ================= -->
  <text x="60" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LE JEUNE BOURGEON SUIT LE SOLEIL</text>
  <rect x="60" y="182" width="330" height="288" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- soleil levant (est) -->
  <g>
    <circle cx="92" cy="304" r="15" fill="#c98a1c"/>
    <g stroke="#c98a1c" stroke-width="2.5">
      <line x1="92" y1="280" x2="92" y2="271"/>
      <line x1="112" y1="291" x2="118" y2="285"/>
      <line x1="72" y1="291" x2="66" y2="285"/>
    </g>
    <text x="92" y="330" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">est</text>
  </g>
  <!-- soleil couchant (ouest) -->
  <g>
    <circle cx="356" cy="304" r="15" fill="#c98a1c"/>
    <g stroke="#c98a1c" stroke-width="2.5">
      <line x1="356" y1="280" x2="356" y2="271"/>
      <line x1="336" y1="291" x2="330" y2="285"/>
      <line x1="376" y1="291" x2="382" y2="285"/>
    </g>
    <text x="356" y="330" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">ouest</text>
  </g>

  <!-- arc du jour -->
  <path d="M 116 288 Q 224 176 332 288" fill="none" stroke="#9c4a1e" stroke-width="3.5" stroke-dasharray="8 6"/>
  <path d="M 332 288 l -14 -4 l 4 12 z" fill="#9c4a1e"/>
  <text x="224" y="196" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#9c4a1e">le jour</text>

  <!-- arc de la nuit -->
  <path d="M 332 322 Q 224 420 116 322" fill="none" stroke="#5c767c" stroke-width="3.5" stroke-dasharray="8 6"/>
  <path d="M 116 322 l 14 -4 l -4 12 z" fill="#5c767c"/>
  <text x="224" y="410" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">la nuit, retour à l'est</text>

  <!-- tige et bouton -->
  <line x1="224" y1="440" x2="224" y2="300" stroke="#4a6b3a" stroke-width="6" stroke-linecap="round"/>
  <g>
    <circle cx="224" cy="286" r="17" fill="#8a5a2b"/>
    <g fill="#c98a1c">
      <ellipse cx="224" cy="262" rx="5" ry="9"/>
      <ellipse cx="247" cy="277" rx="9" ry="5"/>
      <ellipse cx="201" cy="277" rx="9" ry="5"/>
      <ellipse cx="240" cy="297" rx="9" ry="5" transform="rotate(30 240 297)"/>
      <ellipse cx="208" cy="297" rx="9" ry="5" transform="rotate(-30 208 297)"/>
    </g>
  </g>
  <text x="224" y="462" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-style="italic" fill="#6f675c">avant la floraison</text>

  <!-- ================= Panneau 2 : la tige ================= -->
  <text x="410" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LA TIGE POUSSE D'UN CÔTÉ</text>
  <rect x="410" y="182" width="330" height="288" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- le jour -->
  <text x="440" y="216" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#9c4a1e">le jour</text>
  <circle cx="455" cy="248" r="9" fill="#c98a1c"/>
  <!-- tige penchée vers l'ouest -->
  <path d="M 560 330 C 560 280 566 250 596 232" fill="none" stroke="#4a6b3a" stroke-width="8" stroke-linecap="round"/>
  <!-- flèches de croissance côté est (gauche) -->
  <g stroke="#9c4a1e" stroke-width="3" fill="#9c4a1e">
    <line x1="540" y1="318" x2="540" y2="296"/>
    <path d="M 540 292 l -6 10 l 12 0 z"/>
    <line x1="540" y1="284" x2="540" y2="262"/>
    <path d="M 540 258 l -6 10 l 12 0 z"/>
  </g>
  <text x="524" y="330" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#6f675c">côté est</text>
  <text x="700" y="286" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">la tige penche</text>
  <text x="700" y="304" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">vers l'ouest</text>

  <line x1="440" y1="348" x2="710" y2="348" stroke="#ddd6c8" stroke-width="1.5"/>

  <!-- la nuit -->
  <text x="440" y="378" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5c767c">la nuit</text>
  <circle cx="458" cy="410" r="11" fill="#5c767c"/>
  <circle cx="463" cy="406" r="9" fill="#f2ede0"/>
  <!-- tige penchée vers l'est -->
  <path d="M 560 470 C 560 430 566 400 528 384" fill="none" stroke="#4a6b3a" stroke-width="8" stroke-linecap="round"/>
  <!-- flèches de croissance côté ouest (droite) -->
  <g stroke="#5c767c" stroke-width="3" fill="#5c767c">
    <line x1="582" y1="452" x2="582" y2="430"/>
    <path d="M 582 426 l -6 10 l 12 0 z"/>
    <line x1="582" y1="418" x2="582" y2="396"/>
    <path d="M 582 392 l -6 10 l 12 0 z"/>
  </g>
  <text x="600" y="458" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#6f675c">côté ouest</text>
  <text x="700" y="410" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">la tête repart</text>
  <text x="700" y="428" text-anchor="end" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">vers l'est</text>

  <!-- ================= Panneau 3 : la fleur ================= -->
  <text x="760" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LA FLEUR OUVERTE RESTE À L'EST</text>
  <rect x="760" y="182" width="380" height="288" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- soleil du matin -->
  <g>
    <circle cx="812" cy="238" r="18" fill="#c98a1c"/>
    <g stroke="#c98a1c" stroke-width="2.5">
      <line x1="812" y1="208" x2="812" y2="198"/>
      <line x1="836" y1="222" x2="843" y2="215"/>
      <line x1="788" y1="222" x2="781" y2="215"/>
      <line x1="844" y1="246" x2="853" y2="246"/>
    </g>
  </g>

  <!-- tige et fleur mature, tête vers l'est (gauche) -->
  <line x1="1050" y1="452" x2="1050" y2="320" stroke="#4a6b3a" stroke-width="7" stroke-linecap="round"/>
  <g>
    <g fill="#c98a1c">
      <ellipse cx="1050" cy="272" rx="6" ry="12"/>
      <ellipse cx="1084" cy="292" rx="12" ry="6"/>
      <ellipse cx="1016" cy="292" rx="12" ry="6"/>
      <ellipse cx="1075" cy="322" rx="12" ry="6" transform="rotate(35 1075 322)"/>
      <ellipse cx="1025" cy="322" rx="12" ry="6" transform="rotate(-35 1025 322)"/>
      <ellipse cx="1095" cy="307" rx="11" ry="6" transform="rotate(70 1095 307)"/>
      <ellipse cx="1005" cy="307" rx="11" ry="6" transform="rotate(-70 1005 307)"/>
    </g>
    <circle cx="1050" cy="300" r="24" fill="#8a5a2b"/>
    <g fill="#5b3a1a">
      <circle cx="1042" cy="294" r="2"/>
      <circle cx="1054" cy="292" r="2"/>
      <circle cx="1046" cy="306" r="2"/>
      <circle cx="1058" cy="304" r="2"/>
      <circle cx="1050" cy="314" r="2"/>
    </g>
  </g>

  <!-- abeille -->
  <g transform="translate(988 250)">
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#26221c"/>
    <line x1="-3" y1="-2" x2="-3" y2="2" stroke="#c98a1c" stroke-width="2"/>
    <line x1="3" y1="-2" x2="3" y2="2" stroke="#c98a1c" stroke-width="2"/>
    <ellipse cx="-6" cy="-7" rx="6" ry="4" fill="#e8e2d2" opacity="0.85"/>
  </g>

  <text x="878" y="392" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#9c4a1e">≈ 5 fois plus de pollinisateurs</text>
  <text x="878" y="416" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">la tête se réchauffe plus vite au matin</text>
  <text x="878" y="446" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-style="italic" fill="#6f675c">le mouvement s'arrête à la floraison</text>

  <!-- ================= Bandeau bas : l'horloge ================= -->
  <rect x="60" y="500" width="1080" height="212" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="90" y="540" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">L'HORLOGE INTERNE, PAS UN SIMPLE RÉFLEXE</text>

  <!-- colonne 1 -->
  <text x="130" y="586" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Lumière fixe</text>
  <text x="130" y="612" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">Sans soleil mobile, la plante</text>
  <text x="130" y="632" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">continue d'osciller quelques jours.</text>

  <!-- colonne 2 -->
  <text x="480" y="586" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Cycle de 24 h</text>
  <text x="480" y="612" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">La plante suit la lumière</text>
  <text x="480" y="632" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">et anticipe l'aube.</text>
  <g stroke="#4a6b3a" stroke-width="3.5" fill="none">
    <path d="M 810 604 l 8 9 l 16 -20"/>
  </g>

  <!-- colonne 3 -->
  <text x="880" y="586" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#26221c">Cycle de 30 h</text>
  <text x="880" y="612" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">Elle décroche : le rythme</text>
  <text x="880" y="632" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">interne ne suit plus.</text>
  <g stroke="#9c4a1e" stroke-width="3.5">
    <line x1="1046" y1="596" x2="1062" y2="612"/>
    <line x1="1062" y1="596" x2="1046" y2="612"/>
  </g>

  <line x1="90" y1="660" x2="1110" y2="660" stroke="#ddd6c8" stroke-width="1.5"/>
  <text x="600" y="688" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#6f675c">Une horloge circadienne synchronisée par le soleil, qui s'arrête avec la croissance.</text>
</svg>
