<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Le changement d'heure, deux fois par an</title>
  <desc id="desc">En haut, le mécanisme : au printemps on avance d'une heure (2 h devient 3 h), en automne on recule d'une heure (3 h redevient 2 h). Au centre, une frise de dates : 1784, 1895, 1908, 1916, 1976 et 2000. En bas, une barre indique qu'environ un tiers des pays changeaient encore d'heure en 2023, deux tiers vivant à heure constante.</desc>

  <rect width="1200" height="820" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">L'heure d'été n'a pas été inventée pour les agriculteurs</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Une convention née d'un entomologiste et d'une guerre de charbon</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Le mécanisme ================= -->
  <text x="60" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">LE MÉCANISME, DEUX FOIS PAR AN</text>

  <!-- Panneau printemps -->
  <rect x="60" y="182" width="510" height="252" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="315" y="212" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#9c4a1e">PRINTEMPS</text>

  <!-- horloge 2h -->
  <circle cx="180" cy="320" r="62" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <line x1="180" y1="262" x2="180" y2="272" stroke="#6f675c" stroke-width="3"/>
  <line x1="238" y1="320" x2="228" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="180" y1="378" x2="180" y2="368" stroke="#6f675c" stroke-width="3"/>
  <line x1="122" y1="320" x2="132" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="180" y1="320" x2="180" y2="274" stroke="#26221c" stroke-width="4"/>
  <line x1="180" y1="320" x2="209" y2="303" stroke="#9c4a1e" stroke-width="4.5"/>
  <circle cx="180" cy="320" r="5" fill="#26221c"/>
  <text x="180" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#26221c">2 h</text>

  <text x="315" y="318" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="30" fill="#9c4a1e">&#8594;</text>
  <text x="315" y="344" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">on avance</text>
  <text x="315" y="362" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">d'une heure</text>

  <!-- horloge 3h -->
  <circle cx="450" cy="320" r="62" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <line x1="450" y1="262" x2="450" y2="272" stroke="#6f675c" stroke-width="3"/>
  <line x1="508" y1="320" x2="498" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="450" y1="378" x2="450" y2="368" stroke="#6f675c" stroke-width="3"/>
  <line x1="392" y1="320" x2="402" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="450" y1="320" x2="450" y2="274" stroke="#26221c" stroke-width="4"/>
  <line x1="450" y1="320" x2="484" y2="320" stroke="#9c4a1e" stroke-width="4.5"/>
  <circle cx="450" cy="320" r="5" fill="#26221c"/>
  <text x="450" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#26221c">3 h</text>

  <!-- Panneau automne -->
  <rect x="630" y="182" width="510" height="252" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>
  <text x="885" y="212" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5c767c">AUTOMNE</text>

  <!-- horloge 3h -->
  <circle cx="750" cy="320" r="62" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <line x1="750" y1="262" x2="750" y2="272" stroke="#6f675c" stroke-width="3"/>
  <line x1="808" y1="320" x2="798" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="750" y1="378" x2="750" y2="368" stroke="#6f675c" stroke-width="3"/>
  <line x1="692" y1="320" x2="702" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="750" y1="320" x2="750" y2="274" stroke="#26221c" stroke-width="4"/>
  <line x1="750" y1="320" x2="784" y2="320" stroke="#5c767c" stroke-width="4.5"/>
  <circle cx="750" cy="320" r="5" fill="#26221c"/>
  <text x="750" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#26221c">3 h</text>

  <text x="885" y="318" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="30" fill="#5c767c">&#8594;</text>
  <text x="885" y="344" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">on recule</text>
  <text x="885" y="362" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#6f675c">d'une heure</text>

  <!-- horloge 2h -->
  <circle cx="1020" cy="320" r="62" fill="#faf7f0" stroke="#26221c" stroke-width="2.5"/>
  <line x1="1020" y1="262" x2="1020" y2="272" stroke="#6f675c" stroke-width="3"/>
  <line x1="1078" y1="320" x2="1068" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="1020" y1="378" x2="1020" y2="368" stroke="#6f675c" stroke-width="3"/>
  <line x1="962" y1="320" x2="972" y2="320" stroke="#6f675c" stroke-width="3"/>
  <line x1="1020" y1="320" x2="1020" y2="274" stroke="#26221c" stroke-width="4"/>
  <line x1="1020" y1="320" x2="1049" y2="303" stroke="#5c767c" stroke-width="4.5"/>
  <circle cx="1020" cy="320" r="5" fill="#26221c"/>
  <text x="1020" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#26221c">2 h</text>

  <!-- ================= Frise ================= -->
  <line x1="60" y1="470" x2="1140" y2="470" stroke="#ddd6c8" stroke-width="2"/>
  <text x="60" y="510" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">UNE IDÉE QUI A MIS UN SIÈCLE À S'IMPOSER</text>

  <line x1="90" y1="628" x2="1110" y2="628" stroke="#26221c" stroke-width="3"/>

  <g font-family="'DejaVu Sans', sans-serif" text-anchor="middle">
    <circle cx="90" cy="628" r="8" fill="#26221c"/>
    <text x="90" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">1784</text>
    <text x="90" y="658" font-size="12.5" fill="#6f675c">la lettre satirique</text>
    <text x="90" y="676" font-size="12.5" fill="#6f675c">de Franklin</text>

    <circle cx="294" cy="628" r="8" fill="#26221c"/>
    <text x="294" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">1895</text>
    <text x="294" y="658" font-size="12.5" fill="#6f675c">le mémoire de</text>
    <text x="294" y="676" font-size="12.5" fill="#6f675c">Hudson, entomologiste</text>

    <circle cx="498" cy="628" r="8" fill="#26221c"/>
    <text x="498" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">1908</text>
    <text x="498" y="658" font-size="12.5" fill="#6f675c">l'Ontario essaie,</text>
    <text x="498" y="676" font-size="12.5" fill="#6f675c">localement</text>

    <circle cx="702" cy="628" r="8" fill="#9c4a1e"/>
    <text x="702" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">1916</text>
    <text x="702" y="658" font-size="12.5" fill="#6f675c">l'Allemagne, en guerre,</text>
    <text x="702" y="676" font-size="12.5" fill="#6f675c">pour économiser le charbon</text>

    <circle cx="906" cy="628" r="8" fill="#26221c"/>
    <text x="906" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">1976</text>
    <text x="906" y="658" font-size="12.5" fill="#6f675c">la France la rétablit</text>
    <text x="906" y="676" font-size="12.5" fill="#6f675c">après le choc pétrolier</text>

    <circle cx="1110" cy="628" r="8" fill="#9c4a1e"/>
    <text x="1110" y="604" font-family="Georgia, serif" font-size="19" fill="#26221c">2000</text>
    <text x="1110" y="658" font-size="12.5" fill="#6f675c">l'Europe</text>
    <text x="1110" y="676" font-size="12.5" fill="#6f675c">harmonise les dates</text>
  </g>

  <!-- ================= Barre : qui change d'heure ================= -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#ddd6c8" stroke-width="2"/>
  <text x="60" y="754" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">QUI CHANGE ENCORE D'HEURE (2023)</text>

  <rect x="60" y="768" width="360" height="34" rx="6" fill="#9c4a1e"/>
  <text x="240" y="791" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#faf7f0">&#8776; 1/3 des pays</text>

  <rect x="424" y="768" width="716" height="34" rx="6" fill="#cfd8c4"/>
  <text x="782" y="791" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="15" fill="#26221c">&#8776; 2/3 à heure constante (Chine depuis 1992, Russie depuis 2011)</text>
</svg>
