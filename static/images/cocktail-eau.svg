<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Un cocktail, c'est surtout de l'eau</title>
  <desc id="desc">En haut à gauche, un verre à cocktail et une barre de composition : l'alcool et le sucre de la recette occupent les trois quarts, et un quart vient de l'eau de fonte de la glace. En haut à droite, deux techniques comparées : secouer, qui refroidit en quelques secondes et ajoute de l'air, et remuer, plus lent mais plus contrôlable. En bas, une frise de l'essor du commerce de la glace : 1806, 1833, 1870 et 1914.</desc>

  <rect width="1200" height="760" fill="#faf7f0"/>

  <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">L'ingrédient qui n'est sur aucune recette</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#6f675c">Dans un cocktail, le plus gros volume vient de la glace qui a fondu</text>

  <line x1="60" y1="122" x2="1140" y2="122" stroke="#ddd6c8" stroke-width="2"/>

  <!-- ================= Panneau 1 : la part d'eau ================= -->
  <text x="60" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">CE QU'IL Y A DANS LE VERRE</text>

  <rect x="60" y="182" width="510" height="300" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- verre à cocktail -->
  <g>
    <path d="M 100 206 L 208 206 L 162 268 L 162 306 L 146 306 L 146 268 Z" fill="#e7e0cf" stroke="#b7ac95" stroke-width="2"/>
    <line x1="120" y1="222" x2="188" y2="222" stroke="#9c4a1e" stroke-width="8" opacity="0.75"/>
    <line x1="100" y1="206" x2="208" y2="206" stroke="#b7ac95" stroke-width="3"/>
    <line x1="126" y1="306" x2="182" y2="306" stroke="#b7ac95" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="236" y="252" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">un cocktail servi :</text>
  <text x="236" y="274" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">alcool, sucre, aromates,</text>
  <text x="236" y="296" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#5c767c">et de l'eau qu'on n'écrit pas.</text>

  <!-- barre de composition proportionnelle (100 ml) -->
  <g>
    <!-- alcool 60 % -->
    <rect x="90" y="342" width="270" height="54" fill="#c98a1c"/>
    <text x="225" y="375" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#3a2c10">alcool (gin, vermouth)</text>
    <!-- sucre 15 % -->
    <rect x="360" y="342" width="68" height="54" fill="#9c4a1e"/>
    <text x="394" y="375" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#faf7f0">sucre</text>
    <!-- eau 25 % -->
    <rect x="428" y="342" width="112" height="54" fill="#2f6fb0"/>
    <text x="484" y="375" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#eaf1f7">eau</text>

    <!-- crochet 100 ml -->
    <line x1="76" y1="342" x2="76" y2="396" stroke="#26221c" stroke-width="2"/>
    <line x1="72" y1="342" x2="80" y2="342" stroke="#26221c" stroke-width="2"/>
    <line x1="72" y1="396" x2="80" y2="396" stroke="#26221c" stroke-width="2"/>
    <text x="68" y="374" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">100 ml</text>

    <!-- légendes sous la barre -->
    <text x="225" y="416" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#6f675c">60 ml</text>
    <text x="394" y="416" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#6f675c">15 ml</text>
    <text x="484" y="416" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#9c4a1e">25 ml</text>

    <text x="315" y="448" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">Le quart bleu n'est sur aucune recette : il vient de la glace fondue.</text>
    <text x="315" y="468" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#6f675c">C'est lui qui arrondit l'alcool et équilibre le verre.</text>
  </g>

  <!-- ================= Panneau 2 : secouer ou remuer ================= -->
  <text x="630" y="162" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#5c767c">SECOUER OU REMUER</text>

  <rect x="630" y="182" width="510" height="300" rx="8" fill="#f2ede0" stroke="#ddd6c8" stroke-width="2"/>

  <!-- secouer -->
  <g transform="translate(672,214)">
    <rect x="0" y="0" width="210" height="228" rx="8" fill="#faf7f0" stroke="#ddd6c8" stroke-width="2"/>
    <!-- shaker -->
    <path d="M 78 40 L 132 40 L 124 96 L 86 96 Z" fill="#b7ac95" stroke="#8f846e" stroke-width="2"/>
    <rect x="86" y="96" width="38" height="52" rx="4" fill="#cfc6b2" stroke="#8f846e" stroke-width="2"/>
    <circle cx="105" cy="34" r="7" fill="#cfc6b2" stroke="#8f846e" stroke-width="2"/>
    <!-- éclats -->
    <circle cx="66" cy="30" r="4" fill="#2f6fb0" opacity="0.7"/>
    <circle cx="146" cy="26" r="4" fill="#2f6fb0" opacity="0.7"/>
    <circle cx="150" cy="52" r="3" fill="#2f6fb0" opacity="0.7"/>
    <text x="105" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#26221c">Secouer</text>
    <text x="105" y="200" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">froid en quelques secondes,</text>
    <text x="105" y="217" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">de l'air, des éclats de glace</text>
  </g>

  <!-- remuer -->
  <g transform="translate(900,214)">
    <rect x="0" y="0" width="210" height="228" rx="8" fill="#faf7f0" stroke="#ddd6c8" stroke-width="2"/>
    <!-- verre à mélange -->
    <path d="M 66 44 L 144 44 L 138 128 L 72 128 Z" fill="#e7e0cf" stroke="#b7ac95" stroke-width="2"/>
    <line x1="66" y1="44" x2="144" y2="44" stroke="#b7ac95" stroke-width="3"/>
    <line x1="78" y1="70" x2="132" y2="70" stroke="#c98a1c" stroke-width="8" opacity="0.7"/>
    <line x1="105" y1="20" x2="105" y2="118" stroke="#8f846e" stroke-width="3"/>
    <circle cx="105" cy="20" r="5" fill="#8f846e"/>
    <text x="105" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#26221c">Remuer</text>
    <text x="105" y="200" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">froid en quelques minutes,</text>
    <text x="105" y="217" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="12.5" fill="#6f675c">plus de contrôle, plus soyeux</text>
  </g>

  <!-- ================= Frise ================= -->
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#ddd6c8" stroke-width="2"/>

  <line x1="120" y1="648" x2="1080" y2="648" stroke="#26221c" stroke-width="3"/>

  <g font-family="'DejaVu Sans', sans-serif" text-anchor="middle">
    <circle cx="120" cy="648" r="8" fill="#26221c"/>
    <text x="120" y="624" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1806</text>
    <text x="120" y="678" font-size="12.5" fill="#6f675c">Tudor envoie la glace</text>
    <text x="120" y="696" font-size="12.5" fill="#6f675c">de Boston à la Martinique</text>

    <circle cx="440" cy="648" r="8" fill="#26221c"/>
    <text x="440" y="624" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1833</text>
    <text x="440" y="678" font-size="12.5" fill="#6f675c">première glace de Boston</text>
    <text x="440" y="696" font-size="12.5" fill="#6f675c">vendue à Calcutta</text>

    <circle cx="760" cy="648" r="8" fill="#9c4a1e"/>
    <text x="760" y="624" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">années 1870</text>
    <text x="760" y="678" font-size="12.5" fill="#6f675c">apogée : la glace arrive</text>
    <text x="760" y="696" font-size="12.5" fill="#6f675c">dans les villes et les bars</text>

    <circle cx="1080" cy="648" r="8" fill="#9c4a1e"/>
    <text x="1080" y="624" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#26221c">1914</text>
    <text x="1080" y="678" font-size="12.5" fill="#6f675c">la glace d'usine dépasse</text>
    <text x="1080" y="696" font-size="12.5" fill="#6f675c">la glace naturelle</text>
  </g>
</svg>
