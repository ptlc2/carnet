<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Pourquoi les jeux européens allaient moins vite</title>
  <desc id="desc">À gauche, une télévision NTSC à 60 champs par seconde affiche l'image pleine. À droite, une télévision PAL à 50 champs par seconde affiche la même scène encadrée de bandes noires en haut et en bas. En bas, deux barres comparent 60 images contre 50 : le PAL défile environ 17 % plus lentement.</desc>

  <rect width="1200" height="760" fill="#faf7f0"/>

  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#26221c">Pourquoi les jeux européens allaient moins vite</text>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#6f675c">Deux normes de télévision, un ralenti de vingt ans.</text>

  <line x1="600" y1="140" x2="600" y2="558" stroke="#ddd6c8" stroke-width="3"/>

  <!-- ============ Panneau gauche : NTSC ============ -->
  <text x="300" y="188" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#26221c">NTSC</text>
  <text x="300" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#6f675c">États-Unis, Japon</text>
  <text x="300" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">525 lignes · 60 champs par seconde</text>

  <rect x="110" y="275" width="380" height="250" rx="10" fill="#2b2620"/>
  <rect x="126" y="291" width="348" height="218" fill="#d9e3e7"/>
  <rect x="126" y="431" width="348" height="78" fill="#cfc6b2"/>
  <circle cx="200" cy="345" r="26" fill="#e8c98a"/>
  <rect x="385" y="370" width="10" height="61" fill="#8a6b4a"/>
  <ellipse cx="390" cy="365" rx="34" ry="28" fill="#7f9163"/>

  <!-- ============ Panneau droit : PAL ============ -->
  <text x="900" y="188" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#26221c">PAL</text>
  <text x="900" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#6f675c">Europe, Océanie</text>
  <text x="900" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#26221c">625 lignes · 50 champs par seconde</text>

  <rect x="710" y="275" width="380" height="250" rx="10" fill="#2b2620"/>
  <rect x="726" y="291" width="348" height="218" fill="#1b1815"/>
  <rect x="726" y="321" width="348" height="100" fill="#d9e3e7"/>
  <rect x="726" y="421" width="348" height="58" fill="#cfc6b2"/>
  <circle cx="790" cy="360" r="20" fill="#e8c98a"/>
  <rect x="975" y="380" width="8" height="41" fill="#8a6b4a"/>
  <ellipse cx="979" cy="375" rx="26" ry="21" fill="#7f9163"/>
  <text x="900" y="311" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#cfc6b2">bande noire</text>
  <text x="900" y="499" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#cfc6b2">bande noire</text>

  <!-- ============ Comparaison ============ -->
  <text x="600" y="598" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#26221c">En une seconde : 60 images contre 50</text>

  <text x="236" y="648" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26221c">NTSC</text>
  <rect x="250" y="622" width="440" height="34" fill="#9c4a1e"/>
  <text x="704" y="647" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26221c">60</text>

  <text x="236" y="696" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26221c">PAL</text>
  <rect x="250" y="670" width="367" height="34" fill="#c9bfa8"/>
  <text x="631" y="695" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26221c">50</text>

  <text x="760" y="695" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#9c4a1e">≈ 17 % plus lent</text>
</svg>
