{{ define "main" }}
<section class="hero">
  <h1>{{ site.Title }}</h1>
  <p class="lead">{{ site.Params.intro }}</p>
  <p class="hero-actions"><a class="btn" href="{{ "index.xml" | relURL }}">S'abonner au flux RSS</a></p>
</section>
<ul class="post-list">
  {{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
  <li>
    <a class="item" href="{{ .RelPermalink }}">
      <span class="item-title">{{ .Title }}</span>
      <span class="date">{{ .Date | time.Format ":date_long" }}</span>
      <span class="item-summary">{{ .Summary }}</span>
    </a>
  </li>
  {{ end }}
</ul>
<p class="more"><a href="{{ "archives/" | relURL }}">Toutes les archives</a></p>
{{ end }}
