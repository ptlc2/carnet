{{ define "main" }}
<header class="list-head">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<p class="dek">{{ . }}</p>{{ end }}
</header>
<ol class="index">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">
      <time>{{ .Date | time.Format ":date_long" }}</time>
      <span class="i-title">{{ .Title }}</span>
      <span class="i-sum">{{ .Summary }}</span>
    </a>
  </li>
  {{ else }}
  <li><p class="dek">Rien ici pour l'instant.</p></li>
  {{ end }}
</ol>
{{ end }}
