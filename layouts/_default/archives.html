{{ define "main" }}
<header class="list-head">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<p class="dek">{{ . }}</p>{{ end }}
</header>
{{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
<section class="year">
  <h2>{{ .Key }}</h2>
  <ol class="index compact">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">
        <time>{{ .Date | time.Format ":date_long" }}</time>
        <span class="i-title">{{ .Title }}</span>
      </a>
    </li>
    {{ end }}
  </ol>
</section>
{{ end }}
{{ end }}
