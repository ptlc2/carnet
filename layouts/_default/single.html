{{ define "main" }}
<article class="prose">
  <header class="post-head">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}<p class="post-meta">{{ .Date | time.Format ":date_long" }}</p>{{ end }}
  </header>
  {{ .Content }}
  {{ with .GetTerms "tags" }}
  <ul class="tags">{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}</ul>
  {{ end }}
  {{ if eq .Section "posts" }}<p class="back"><a href="{{ "/" | relURL }}">Retour aux billets</a></p>{{ end }}
</article>
{{ end }}
